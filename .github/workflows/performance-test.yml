name: Position Evaluator Performance Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/simulator/evaluator.py'
      - 'src/simulator/game_state.py'
      - 'tests/test_evaluator.py'
      - 'ci_performance_test.py'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/simulator/evaluator.py'
      - 'src/simulator/game_state.py'
      - 'tests/test_evaluator.py'
      - 'ci_performance_test.py'

jobs:
  performance-test:
    name: PositionEvaluator Performance Regression Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Run unit tests
      run: |
        python tests/test_evaluator.py
    
    - name: Run performance regression test
      run: |
        python ci_performance_test.py
    
    - name: Verify optimization correctness
      run: |
        python verify_optimizations.py
    
    - name: Run full benchmark (informational)
      run: |
        python benchmark_evaluator.py --quick